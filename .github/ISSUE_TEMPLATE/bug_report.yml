name: Bug report
description: Report something that is not working
labels: [bug]
body:
  - type: textarea
    id: description
    attributes: {label: What happened?, description: Describe the bug.}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Steps to reproduce, placeholder: "1. Go to ...\n2. Click ..."}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behaviour}
    validations: {required: true}
  - type: dropdown
    id: language
    attributes:
      label: Language / direction
      options: [English (LTR), Arabic (RTL), Both]
    validations: {required: true}
  - type: input
    id: env
    attributes: {label: Browser and OS, placeholder: Safari 18 on macOS}
  - type: textarea
    id: extra
    attributes: {label: Screenshots or console output}
