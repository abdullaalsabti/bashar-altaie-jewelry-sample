          - generic [ref=e232]:
            - paragraph [ref=e233]: The workshop has been in Sweifieh for close to twenty years, on Subhi Al-Omari Street. Two benches, four hands, and a drawer of gravers older than anyone using them. In that time our designs have been copied often enough that we take it as the measure.
