          - generic [ref=f9e280]:
            - paragraph [ref=f9e281]: The workshop has been in Sweifieh for close to twenty years, on Subhi Al-Omari Street. Two benches, four hands, and a drawer of gravers older than anyone using them. In that time our designs have been copied often enough that we take it as the measure.
            - paragraph [ref=f9e282]: We do not hold stock. A piece is made when someone asks for it, and the stone is chosen with them — in the room, under daylight, before a single line is drawn.
